{
  "name": "OrbitLink iOS compile check",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "orbitlink-ios-check",
    "cancel-in-progress": true
  },
  "jobs": {
    "compile": {
      "name": "Logic tests and unsigned iPhone build",
      "runs-on": "macos-26",
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "Checkout source archive",
          "uses": "actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify and extract source archive",
          "run": "python3 - <<'PY'\nimport hashlib, pathlib, zipfile\np = pathlib.Path('OrbitLink-iOS-cloud-build-source.zip')\nexpected = 'ca66ced3b99a2d7f2d6bc69745fe96ee20f6ca0033ad553dc9e494109191c59c'\nassert hashlib.sha256(p.read_bytes()).hexdigest() == expected, 'Source archive checksum mismatch'\nwith zipfile.ZipFile(p) as z:\n    for entry in z.infolist():\n        path = pathlib.PurePosixPath(entry.filename)\n        assert not path.is_absolute() and '..' not in path.parts, 'Unsafe archive path'\n    z.extractall('source')\nPY"
        },
        {
          "name": "Set up pinned Go",
          "uses": "actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00",
          "with": {
            "go-version": "1.26.8",
            "cache": false
          }
        },
        {
          "name": "Run native build checks",
          "working-directory": "source/OrbitLink-iOS-1.0.0",
          "run": "python3 scripts/cloud-check.py"
        },
        {
          "name": "Save diagnostic reports",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "OrbitLink-iOS-compile-report-${{ github.run_id }}",
            "path": "source/OrbitLink-iOS-1.0.0/CloudReports/",
            "if-no-files-found": "warn",
            "retention-days": 1
          }
        }
      ]
    }
  }
}
